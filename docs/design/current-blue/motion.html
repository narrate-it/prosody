<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prosody — motion study</title><style>*{box-sizing:border-box}body{margin:0;background:#e4e7ed;color:#161a24;font:16px Avenir,Arial,sans-serif;display:grid;place-items:center;padding:24px}aside{max-width:440px;text-align:center;margin:16px}article{width:min(390px,100%);height:760px;border:1px solid #a8b2c4;border-radius:40px;background:#f5f6f8;padding:36px 28px;display:flex;flex-direction:column;touch-action:pan-x}article.dark{background:#161a24;color:#f5f6f8}header{display:flex;justify-content:space-between}small{color:#626d80;letter-spacing:2px}h1{font-size:34px;font-weight:500;line-height:1.2;letter-spacing:-1px;margin-top:22px}p{line-height:1.5;color:#626d80}.dark p,.dark small{color:#a8b2c4}canvas{width:100%;height:180px;margin:auto 0}button{font:inherit;border:0;cursor:pointer;min-height:44px;padding:10px 16px;border-radius:24px;background:transparent;color:inherit}#play{background:#3154d9;color:#fff;width:80px;height:80px;font-size:24px}nav{display:flex;justify-content:space-around;align-items:center;margin:28px 0}.track{height:3px;background:#a8b2c4}.track i{display:block;height:3px;background:#3154d9;width:30%}footer{text-align:center;font-size:12px;letter-spacing:2px;margin-top:auto}label{font-size:14px}a{color:#3154d9}</style>
<aside><a href="index.html">Back to designs</a><p>Motion study · simulated waveform, no audio.<br>Swipe up, press ↓, or choose Next.</p><label><input id="reduce" type="checkbox"> Reduce motion</label></aside>
<article id="phone"><header>Personal <button id="theme" aria-label="Toggle appearance">◐</button></header><small id="source">RESEARCH AGENT</small><h1 id="title">A small change.<br>A useful result.</h1><p id="copy">Processing is faster. Another run will test whether it holds.</p><canvas id="wave" aria-label="Playback waveform illustration"></canvas><div class="track"><i></i></div><nav><button id="prev" aria-label="Previous item">↑</button><button id="play" aria-label="Pause motion">Ⅱ</button><button id="next" aria-label="Next item">↓</button></nav><footer>SWIPE UP FOR NEXT</footer></article>
<script>const $=s=>document.getElementById(s),c=$('wave'),ctx=c.getContext('2d');c.width=668;c.height=360;let playing=true,index=0,phase=0,last=0;const media=matchMedia('(prefers-reduced-motion: reduce)');$('reduce').checked=media.matches;media.addEventListener('change',e=>$('reduce').checked=e.matches);const items=[['RESEARCH AGENT','A small change.<br>A useful result.','Processing is faster. Another run will test whether it holds.'],['FIELD AGENT','A walk through<br>the new space.','Original audio · 18 min 40 sec'],['STUDIO AGENT','The week,<br>in perspective.','A concise briefing from your team.']];function move(n){index=Math.max(0,Math.min(items.length-1,index+n));['source','title','copy'].forEach((id,i)=>$(id).innerHTML=items[index][i]);phase=0;$('prev').disabled=index===0;$('next').disabled=index===items.length-1}move(0);$('next').onclick=()=>move(1);$('prev').onclick=()=>move(-1);$('theme').onclick=()=>$('phone').classList.toggle('dark');$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Ⅱ':'▶';$('play').ariaLabel=playing?'Pause motion':'Play motion'};let start; $('phone').addEventListener('touchstart',e=>start=e.touches[0].clientY,{passive:true});$('phone').addEventListener('touchend',e=>{const d=start-e.changedTouches[0].clientY;if(Math.abs(d)>60)move(d>0?1:-1)},{passive:true});document.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();move(1)}if(e.key==='ArrowUp'){e.preventDefault();move(-1)}});function draw(t){if(playing&&!$('reduce').checked&&!document.hidden)phase+=Math.min((t-last)/1000,.04);last=t;ctx.clearRect(0,0,668,360);ctx.strokeStyle='#3154d9';ctx.lineWidth=6;ctx.lineCap='round';for(let i=0;i<55;i++){let x=12+i*12,envelope=Math.sin(i/54*Math.PI)**1.3,h=6+envelope*(28+60*Math.abs(Math.sin(i*.31-phase*2.4))+40*Math.abs(Math.sin(i*.16+phase)));ctx.beginPath();ctx.moveTo(x,180-h);ctx.lineTo(x,180+h);ctx.stroke()}requestAnimationFrame(draw)}requestAnimationFrame(draw);</script>
