name: prosody
publish_to: none
description: A quiet place to listen to your agents.
version: 0.1.0+1
environment:
  sdk: '>=3.13.7 <4.0.0'
  flutter: '>=3.47.9'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  path_provider: ^2.1.5
  audio_service:
    path: vendor/audio_service
  just_audio: ^0.10.6
  audio_session: ^0.2.2
  video_player: ^2.9.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/preview/
